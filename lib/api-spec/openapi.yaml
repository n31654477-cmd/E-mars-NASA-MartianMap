openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mars/summary:
    get:
      operationId: getMarsSummary
      responses:
        "200":
          description: Evidence, capabilities and source layer inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarsSummary" }
  /mars/layers/{id}/features:
    get:
      operationId: getMarsFeatures
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Display-only GeoJSON in Mars spherical degrees, not WGS84
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarsFeatureCollection" }
  /mars/inspect:
    get:
      operationId: inspectMarsLocation
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number } }
        - { name: longitude, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: Exact unsimplified source geometry point coverage and scientific gaps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarsInspection" }
  /mars/grid:
    post:
      operationId: generateMarsGrid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarsGridInput" }
      responses:
        "200":
          description: Source-linked scientific grid; unknown costs and traversability stay null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarsGrid" }
  /mars/route:
    post:
      operationId: assessMarsRoute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarsRouteInput" }
      responses:
        "200":
          description: Explicit routing eligibility; no route without sufficient evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarsRoutingStatus" }
  /mars/event:
    post:
      operationId: simulateMarsEvent
      summary: Apply a bounded simulated factor increase along the current route and reroute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarsScenarioInput" }
      responses:
        "200":
          description: Updated scenario grid, immediate old/new routes, and replayable event history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarsScenarioResult" }
        "400":
          description: Invalid scenario, no route, exhausted factors or event limit
  /mars/lab:
    post:
      operationId: runMarsAlgorithm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarsLabInput" }
      responses:
        "200":
          description: Original C# algorithm on a clearly synthetic fixed test fixture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarsLabResult" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarsSummary:
      type: object
      required: [title, scientificRoutingAvailable, limitation, algorithms, layers, missingMeasurements, methods, sourceCount, riskModel]
      properties:
        title: { type: string }
        riskModel: { $ref: "#/components/schemas/MarsRiskModel" }
        scientificRoutingAvailable: { type: boolean }
        limitation: { type: string }
        sourceCount: { type: integer }
        algorithms: { type: array, items: { $ref: "#/components/schemas/MarsAlgorithm" } }
        layers: { type: array, items: { $ref: "#/components/schemas/MarsLayer" } }
        missingMeasurements: { type: array, items: { type: string } }
        methods: { type: array, items: { type: string } }
    MarsAlgorithm:
      type: object
      required: [id, name, objective, description, source]
      properties:
        id: { type: string }
        name: { type: string }
        objective: { type: string }
        description: { type: string }
        source: { type: string }
    MarsLayer:
      type: object
      required: [id, name, filename, count, units, crs, sourceUrl, role, displayAvailable]
      properties:
        id: { type: string }
        name: { type: string }
        filename: { type: string }
        count: { type: integer }
        units: { type: string }
        crs: { type: string }
        sourceUrl: { type: string }
        role: { type: string }
        displayAvailable: { type: boolean }
    MarsFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string }
        features: { type: array, items: { type: object, additionalProperties: true } }
    MarsInspection:
      type: object
      required: [latitude, longitude, status, evidence, missingMeasurements, warning]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        status: { type: string }
        warning: { type: string }
        missingMeasurements: { type: array, items: { type: string } }
        evidence: { type: array, items: { $ref: "#/components/schemas/MarsEvidence" } }
    MarsEvidence:
      type: object
      required: [layerId, filename, layer, featureId, sourceUrl, properties]
      properties:
        layerId: { type: string }
        filename: { type: string }
        layer: { type: string }
        featureId: { type: integer }
        sourceUrl: { type: string }
        properties: { type: object, additionalProperties: true }
    MarsGridInput:
      type: object
      required: [startLat, endLat, startLng, endLng, rows, columns]
      properties:
        startLat: { type: number, minimum: -90, maximum: 90 }
        endLat: { type: number, minimum: -90, maximum: 90 }
        startLng: { type: number, minimum: -180, maximum: 180 }
        endLng: { type: number, minimum: -180, maximum: 180 }
        rows: { type: integer, minimum: 1, maximum: 80 }
        columns: { type: integer, minimum: 1, maximum: 80 }
    MarsGrid:
      type: object
      required: [rows, columns, cells, warning, bounds]
      properties:
        rows: { type: integer }
        columns: { type: integer }
        warning: { type: string }
        bounds: { $ref: "#/components/schemas/MarsGridInput" }
        cells: { type: array, items: { $ref: "#/components/schemas/MarsScientificCell" } }
    MarsScientificCell:
      type: object
      required: [row, col, centerLat, centerLng, width, height, safetyStatus, blocked, df, safetyScore, units, assessment]
      properties:
        row: { type: integer }
        col: { type: integer }
        centerLat: { type: number }
        centerLng: { type: number }
        width: { type: number }
        height: { type: number }
        safetyStatus: { type: string }
        assessment: { $ref: "#/components/schemas/MarsRiskAssessment" }
        blocked: { type: ["boolean", "null"] }
        df: { type: ["number", "null"] }
        safetyScore: { type: ["number", "null"] }
        units: { type: array, items: { type: string } }
    MarsRouteInput:
      type: object
      required: [algorithm, startLat, startLng, endLat, endLng, grid]
      properties:
        algorithm: { type: string, enum: [bfs, dijkstra, astar] }
        grid: { $ref: "#/components/schemas/MarsGridInput" }
        startLat: { type: number }
        startLng: { type: number }
        endLat: { type: number }
        endLng: { type: number }
        events:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/MarsHazardEvent" }
    MarsHazardEvent:
      type: object
      required: [row, col, factor, delta]
      properties:
        row: { type: integer, minimum: 0 }
        col: { type: integer, minimum: 0 }
        factor: { type: string, enum: [terrain, structure] }
        delta: { type: number, exclusiveMinimum: 0, maximum: 0.25 }
    MarsScenarioInput:
      type: object
      required: [route]
      properties:
        route: { $ref: "#/components/schemas/MarsRouteInput" }
        seed: { type: integer, format: int32 }
        travelerPathIndex:
          type: integer
          minimum: 0
          description: Optional index on the current pre-event route. Set before the event; uses that cell as the remaining-route origin. Must precede the destination. Omit to preserve full-route behavior.
    MarsEventChange:
      type: object
      required: [row, col, origin, areaKm2, factorBefore, factorAfter, dfBefore, dfAfter, deltaDf]
      properties:
        row: { type: integer }
        col: { type: integer }
        origin: { type: boolean }
        areaKm2: { type: number }
        factorBefore: { type: number }
        factorAfter: { type: number }
        dfBefore: { type: number }
        dfAfter: { type: number }
        deltaDf: { type: number }
    MarsEventDetail:
      type: object
      required: [seed, spec, changes, formula, warning]
      properties:
        seed: { type: integer }
        spec: { $ref: "#/components/schemas/MarsHazardEvent" }
        changes: { type: array, items: { $ref: "#/components/schemas/MarsEventChange" } }
        formula: { type: string }
        warning: { type: string }
    MarsScenarioResult:
      type: object
      required: [grid, oldRoute, newRoute, event, events]
      properties:
        grid: { $ref: "#/components/schemas/MarsGrid" }
        oldRoute: { $ref: "#/components/schemas/MarsRoutingStatus" }
        newRoute: { $ref: "#/components/schemas/MarsRoutingStatus" }
        event: { $ref: "#/components/schemas/MarsEventDetail" }
        events: { type: array, items: { $ref: "#/components/schemas/MarsHazardEvent" } }
    MarsRoutingStatus:
      type: object
      required: [available, reason, missingMeasurements, path, totalCost, avgSafetyScore, minSafetyScore, distanceKm, modelVersion, scientificallyValidated, accumulatedRisk, warning]
      properties:
        available: { type: boolean }
        reason: { type: string }
        missingMeasurements: { type: array, items: { type: string } }
        path: { type: array, items: { $ref: "#/components/schemas/MarsScientificCell" } }
        totalCost: { type: number }
        avgSafetyScore: { type: number }
        minSafetyScore: { type: number }
        distanceKm: { type: number }
        modelVersion: { type: string }
        scientificallyValidated: { type: boolean }
        accumulatedRisk: { type: number }
        warning: { type: string }
    MarsRiskAssessment:
      type: object
      required: [modelVersion, riskScore, modelSafetyScore, movementCost, geologyCovered, status, factors, evidence, unknowns, warning]
      properties:
        modelVersion: { type: string }
        riskScore: { type: number }
        modelSafetyScore: { type: number }
        movementCost: { type: number }
        geologyCovered: { type: boolean }
        status: { type: string }
        factors: { type: array, items: { $ref: "#/components/schemas/MarsRiskFactor" } }
        evidence: { type: array, items: { $ref: "#/components/schemas/MarsRiskEvidence" } }
        unknowns: { type: array, items: { type: string } }
        warning: { type: string }
    MarsRiskFactor:
      type: object
      required: [id, name, weight, rawScore, contribution, basis]
      properties:
        id: { type: string }
        name: { type: string }
        weight: { type: number }
        rawScore: { type: number }
        contribution: { type: number }
        basis: { type: string }
    MarsRiskEvidence:
      type: object
      required: [filename, layer, featureId, value]
      properties:
        filename: { type: string }
        layer: { type: string }
        featureId: { type: integer }
        value: { type: string }
    MarsRiskModel:
      type: object
      required: [version, formula, warning, calibration, spatialPolicy, routingPolicy, factors, exclusions, references]
      properties:
        version: { type: string }
        formula: { type: string }
        warning: { type: string }
        calibration: { type: string }
        spatialPolicy: { type: string }
        routingPolicy: { type: string }
        factors: { type: array, items: { $ref: "#/components/schemas/MarsRiskDefinition" } }
        exclusions: { type: array, items: { type: string } }
        references: { type: array, items: { $ref: "#/components/schemas/MarsRiskReference" } }
    MarsRiskDefinition:
      type: object
      required: [id, name, weight, rationale, rules]
      properties:
        id: { type: string }
        name: { type: string }
        weight: { type: number }
        rationale: { type: string }
        rules: { type: array, items: { $ref: "#/components/schemas/MarsRiskRule" } }
    MarsRiskRule:
      type: object
      required: [name, score, match]
      properties:
        name: { type: string }
        score: { type: number }
        match: { type: string }
    MarsRiskReference:
      type: object
      required: [title, url, locator]
      properties:
        title: { type: string }
        url: { type: string }
        locator: { type: string }
    MarsLabInput:
      type: object
      required: [algorithm, fixture]
      properties:
        algorithm: { type: string, enum: [bfs, dijkstra, astar] }
        fixture: { type: string, enum: [weighted, tie, unreachable, same-point, zero-cost] }
    MarsLabResult:
      type: object
      required: [algorithm, fixture, synthetic, rows, columns, cells, path, totalCost, avgSafetyScore, minSafetyScore, visitedPathCells, found, warning]
      properties:
        algorithm: { type: string }
        fixture: { type: string }
        synthetic: { type: boolean }
        rows: { type: integer }
        columns: { type: integer }
        cells: { type: array, items: { $ref: "#/components/schemas/MarsLabCell" } }
        path: { type: array, items: { $ref: "#/components/schemas/MarsPoint" } }
        totalCost: { type: number }
        avgSafetyScore: { type: number }
        minSafetyScore: { type: number }
        visitedPathCells: { type: integer }
        found: { type: boolean }
        warning: { type: string }
    MarsPoint:
      type: object
      required: [row, col]
      properties:
        row: { type: integer }
        col: { type: integer }
    MarsLabCell:
      type: object
      required: [row, col, df, blocked]
      properties:
        row: { type: integer }
        col: { type: integer }
        df: { type: number }
        blocked: { type: boolean }

